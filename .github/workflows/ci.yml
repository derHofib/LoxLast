name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Node 22 (LTS, .nvmrc) und die jeweils aktuelle Version: LastPlan soll auf beiden laufen.
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatierung
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typprüfung
        run: pnpm typecheck
      - name: Wallbox-Bibliothek prüfen
        run: pnpm --filter @lastplan/wallbox-library test
      - name: Tests mit Abdeckung
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser installieren
        run: pnpm --filter @lastplan/e2e exec playwright install --with-deps chromium
      - name: E2E-Tests (inkl. axe-Prüfung)
        run: pnpm --filter @lastplan/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
